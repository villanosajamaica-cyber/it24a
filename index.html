<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>
    

<h1>Todo List</h1>

<input
    type="text"
    id="taskInput"
    placeholder="Add a task"
/>

<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

<script>
    function getTaskText() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();

        console.log("The input value is: " + input.value);

        return text;
    }

    function addTask() {
        const taskText = getTaskText();

        if (taskText === "") {
            alert("Please enter a task.");
            return;
        }

        addTaskItem(taskText);

        document.getElementById('taskInput').value = "";
    }

    function addTaskItem(taskText) {
        const li = document.createElement('li');

        const taskSpan = document.createElement('span');
        taskSpan.textContent = taskText;

        li.appendChild(taskSpan);

        document.getElementById('taskList').appendChild(li);

        //call createDoneButton function
        const donBtn = createDoneButton(li);
        li.appendChild(donBtn);
    }

    function createDoneButton(li) {
            const doneBtn = document.createElement("button");
            doneBtn.textContent = "Done";

            doneBtn.onclick = () => {
                console.log(li);
                li.classList.add("done");
                const buttons = li.querySelectorAll("button");

                buttons.forEach((btn) => {
                    btn.disabled = true;
                });

                console.log("Task Completed", li.textContent, Data());
            }
            return doneBtn;
        }


</script>

</body>
</html>
