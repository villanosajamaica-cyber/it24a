<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            height: 500px;
        }

        .popup-image {
            max-width: 200px;
            height: auto;
            object-fit: fill;
        }
    </style>
</head>

<body>
    <h1>Simple Map</h1>
    <div id="map"></div>

    <script>
        function initMap(mapDataUrl) {

            // Render Map
            const map = L.map('map').setView([8.360, 124.868], 17);

            // OpenStreetMap Layer
            const openStreetMap = L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }
            );

            // Satellite Layer
            const satellite = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics and the GIS User Community'
                }
            );

            satellite.addTo(map);

            // Render Pins
            fetch(mapDataUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Unable to load ' + mapDataUrl);
                    }

                    return response.json();
                })
                .then(data => {

                    data.forEach(pin => {
                        const marker = L.marker([pin.lat, pin.long])
                            .addTo(map);

                        const image = pin.img
                            ? `<img src="${pin.img}" class="popup-image" alt="${pin.title}">`
                            : '';

                        marker.bindPopup(`
                            ${pin.title}<br>
                            <hr>
                            ${image}
                        `);
                    });

                    // Layer Control
                    const baseMaps = {
                        "OpenStreetMap": openStreetMap,
                        "Satellite": satellite
                    };

                    L.control.layers(baseMaps).addTo(map);

                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading map data. Please check campus-map.json.');
                });
        }

        initMap('campus-map.json');
    </script>
</body>

</html>
